[project]
name = "helpdesk-sla"
version = "0.1.0"
description = "Multi-tenant helpdesk with SLA tracking in business hours"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = [
    "celery[redis]>=5.7,<6",
    "django>=5.2,<5.3",
    "django-environ>=0.14.0",
    "gunicorn>=27.0.1",
    "psycopg[binary]>=3.3.9",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
# Make "config" and "apps" importable from the repository root, explicitly,
# instead of letting pytest-django guess the project location from manage.py.
pythonpath = ["backend"]
django_find_project = false
testpaths = ["backend"]
filterwarnings = [
    # STATIC_ROOT only exists after collectstatic, which runs in the image build.
    "ignore:No directory at:UserWarning",
]

[tool.ruff]
line-length = 100
# Project code lives in backend/: "apps" and "config" are first-party imports.
src = ["backend"]
# target-version is read from requires-python.

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes: undefined names, unused imports
    "I",   # isort: import order
    "B",   # flake8-bugbear: likely bugs (mutable defaults, ...)
    "UP",  # pyupgrade: modern syntax for the target Python version
    "DJ",  # flake8-django: Django-specific pitfalls
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]

[tool.ruff.lint.per-file-ignores]
# Migrations are linted too (hand-written RunSQL ones matter), but generated ones
# contain long strings (help_text, SQL) that the formatter cannot split.
"**/migrations/*" = ["E501"]

[tool.ruff.format]
# Python on Windows writes CRLF in text mode, so files generated by makemigrations
# arrive with CRLF. The default ("auto") would keep them; the repository uses LF.
line-ending = "lf"
