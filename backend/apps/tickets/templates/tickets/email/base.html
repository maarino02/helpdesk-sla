<!doctype html>
{% comment %}
Shared layout of the HTML emails. Inline styles only: many email clients drop
<style> blocks and never load external stylesheets. Autoescaping must stay on
in every HTML email (a test checks it): titles and comments are written by users.
{% endcomment %}
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ ticket.reference }}</title>
</head>
<body style="margin:0; padding:24px 16px; background:#f3f4f6; color:#1f2937; font-family:Arial, Helvetica, sans-serif; font-size:15px; line-height:1.5;">
<div style="max-width:560px; margin:0 auto; padding:24px; background:#ffffff; border-radius:6px;">
<p style="margin:0 0 16px;">Hola, {{ recipient.full_name }}:</p>
{% block content %}{% endblock %}
<p style="margin:24px 0;">
<a href="{{ ticket_url }}" style="display:inline-block; padding:10px 16px; background:#1d4ed8; color:#ffffff; text-decoration:none; border-radius:4px;">Ver la incidencia {{ ticket.reference }}</a>
</p>
<p style="margin:0; color:#4b5563;">{% block signature %}HelpDesk SLA{% endblock %}</p>
</div>
</body>
</html>
