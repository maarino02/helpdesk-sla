# Hooks run on staged files before each commit.
# Setup once per clone: uv run pre-commit install
# Run on the whole repository: uv run pre-commit run --all-files

# Third-party files are kept byte for byte as published (their checksum must still
# match), so no hook may fix them: the source map has no final newline and is
# larger than check-added-large-files allows.
exclude: ^backend/apps/web/static/web/vendor/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Two trailing spaces are a line break in Markdown (see .editorconfig).
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  # Ruff runs from the project environment instead of the usual remote hook, so
  # the editor, make lint, pre-commit and CI all use the version in uv.lock.
  - repo: local
    hooks:
      # Lint first: some autofixes (import order) change code the formatter
      # would otherwise have to format twice.
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
