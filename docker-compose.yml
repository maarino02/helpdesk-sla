name: helpdesk-sla

# Shared by the application services (migrate, web, worker, beat). They run the
# production image to try it locally before deploying, and belong to the "app"
# profile: "make up" still starts only db and redis for development on the host,
# "make up-app" starts everything. Never run both stacks at once: two beats would
# send every periodic task twice.
x-app: &app
  image: helpdesk-sla:local
  build: .
  profiles: [app]
  # No env_file: .env points to 127.0.0.1, which inside a container is the
  # container itself. Other services are reached by name on the compose network.
  environment: &app-environment
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
    JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY in .env}
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    # No TLS locally. Secure cookies still work on http://localhost, which
    # browsers treat as a secure context.
    DJANGO_SECURE_SSL_REDIRECT: "false"
    # connect_timeout: fail fast instead of hanging if the database stops answering.
    # helpdesk_app: row-level security always applies. The owner's URL is added
    # only to the migrate service.
    DATABASE_URL: postgres://helpdesk_app:${HELPDESK_APP_PASSWORD:-helpdesk_app}@db:5432/${POSTGRES_DB:-helpdesk}?connect_timeout=5
    REDIS_URL: redis://redis:6379/0
    REDIS_CACHE_URL: redis://redis:6379/1
    # Emails are printed to the worker log (docker compose logs worker).
    EMAIL_URL: consolemail://
    DEFAULT_FROM_EMAIL: HelpDesk SLA <no-reply@localhost>

services:
  db:
    # Debian-based image (not Alpine) so collations match CI and production.
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helpdesk}
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
      # Defaults for psql and pg_isready inside the container.
      PGUSER: ${POSTGRES_USER:-helpdesk}
      PGDATABASE: ${POSTGRES_DB:-helpdesk}
      # Read by docker/postgres/roles.sql. Development values only.
      HELPDESK_OWNER_PASSWORD: ${HELPDESK_OWNER_PASSWORD:-helpdesk_owner}
      HELPDESK_APP_PASSWORD: ${HELPDESK_APP_PASSWORD:-helpdesk_app}
    ports:
      # Bound to localhost only: not reachable from other machines on the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts in this folder run only when the data volume is empty. On an
      # existing volume, run "make db-roles" instead.
      - ./docker/postgres/roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      # -h forces a TCP check. During first-time initialization the image runs a
      # temporary server that only listens on the Unix socket, so a socket check
      # would report "ready" too early.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-off: applies migrations and exits. The application services start only
  # after it succeeds, so they never run against an outdated schema.
  migrate:
    <<: *app
    command: migrate
    # YAML merge keys are shallow: an environment key here would replace the
    # shared one instead of extending it, so merge the shared map explicitly.
    environment:
      <<: *app-environment
      DATABASE_OWNER_URL: postgres://helpdesk_owner:${HELPDESK_OWNER_PASSWORD:-helpdesk_owner}@db:5432/${POSTGRES_DB:-helpdesk}?connect_timeout=5
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    <<: *app
    command: web
    ports:
      - "127.0.0.1:8000:8000"
    depends_on: &app-depends-on
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # Liveness, not readiness: a database outage must not mark web unhealthy.
      # Python instead of curl, which the slim image lacks; urlopen raises on
      # any non-2xx response.
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/health/live/", timeout=3)
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    <<: *app
    # One process per CPU by default (16 on a desktop); two is plenty locally.
    command: [worker, --concurrency=2]
    depends_on: *app-depends-on
    restart: unless-stopped
    healthcheck:
      # Asks this worker (named after the container hostname) to reply through
      # the broker. It starts a Python process, hence the long interval.
      test: ["CMD-SHELL", "celery -A config inspect ping --destination celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

  # Exactly one beat. No healthcheck: it has no simple health signal, and
  # restart brings it back if the process dies.
  beat:
    <<: *app
    command: beat
    depends_on: *app-depends-on
    restart: unless-stopped

volumes:
  pgdata:
