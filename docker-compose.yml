name: helpdesk-sla

services:
  db:
    # Debian-based image (not Alpine) so collations match CI and production.
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helpdesk}
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
      # Defaults for psql and pg_isready inside the container.
      PGUSER: ${POSTGRES_USER:-helpdesk}
      PGDATABASE: ${POSTGRES_DB:-helpdesk}
    ports:
      # Bound to localhost only: not reachable from other machines on the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h forces a TCP check. During first-time initialization the image runs a
      # temporary server that only listens on the Unix socket, so a socket check
      # would report "ready" too early.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:8
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
